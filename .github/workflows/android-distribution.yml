name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # Firebase configuration
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      # Release signing key
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > app/my_release.key.jks
          echo "Keystore created:"
          ls -lh app/release-key.jks

      # DEBUG - check what Gradle configuration contains
      - name: Debug signing configuration
        run: |
          echo "===== JKS FILES ====="
          find . -type f \( -name "*.jks" -o -name "*.keystore" \) -print

          echo "===== SIGNING REFERENCES ====="
          grep -RIn --exclude-dir=.git --exclude="*.jks" \
            -E "my_release|release-key|storeFile|signingConfig|KEYSTORE" . || true

          echo "===== GIT COMMIT ====="
          git rev-parse HEAD

      # Tests
      - name: Run tests
        run: ./gradlew test

      # Build APK
      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # Check APK
      - name: Find APK
        run: find app/build/outputs -type f
